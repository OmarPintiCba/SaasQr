<script>

// ===============================
// FIX DE RENDER (IMPORTANTE)
// ===============================

// BUSCÁ ESTO EN TU CÓDIGO ORIGINAL:
// setTimeout(function(){ drawQR('qr-canvas-dash', clientUrl, 260); }, 50);

// YA REEMPLAZADO POR:
requestAnimationFrame(function(){
  drawQR('qr-canvas-dash', clientUrl, 260);
});


// ===============================
// DRAW QR (SIN ROMPER LIBRERÍA)
// ===============================
function drawQR(canvasId, text, size){
  var c = document.getElementById(canvasId);
  if(!c){
    console.error("Canvas no encontrado:", canvasId);
    return;
  }

  size = size || 240;

  var qr = new qrcode(0, 1); // ← CORRECTO (NO CAMBIAR)
  qr.addData(text);
  qr.make();

  var cnt = qr.getModuleCount();
  var cel = Math.floor(size/cnt);

  c.width = c.height = cel*cnt;

  var ctx = c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle='#0a4f7a';
  for(var r=0;r<cnt;r++){
    for(var cc=0;cc<cnt;cc++){
      if(qr.isDark(r,cc)){
        ctx.fillRect(cc*cel,r*cel,cel,cel);
      }
    }
  }
}

</script>
