// ══════════════════════════════════════════════
//  QR DRAW ON CANVAS
// ══════════════════════════════════════════════
function drawQR(canvasId, text, size){
  size = size || 240;
  var qr = new qrcode(0, 'L');
  qr.addData(text);
  qr.make();
  var c   = document.getElementById(canvasId);
  var cnt = qr.getModuleCount();
  var cel = Math.floor(size/cnt);
  c.width = c.height = cel*cnt;
  var ctx = c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#0a4f7a';
  for(var r=0;r<cnt;r++) for(var cc=0;cc<cnt;cc++) if(qr.isDark(r,cc)) ctx.fillRect(cc*cel,r*cel,cel,cel);
}

// ══════════════════════════════════════════════
//  STATE & DB (localStorage)
// ══════════════════════════════════════════════
function getDB(){ return JSON.parse(localStorage.getItem('ha_db')||'{"users":[]}'); }
function saveDB(db){ localStorage.setItem('ha_db', JSON.stringify(db)); }
function getSession(){ return JSON.parse(localStorage.getItem('ha_session')||'null'); }
function saveSession(s){ localStorage.setItem('ha_session', JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem('ha_session'); }
function getUser(){
  var s=getSession(); if(!s) return null;
  var db=getDB(); return db.users.find(function(u){return u.id===s.userId;})||null;
}

var selectedPlan = 'free';
var currentDispId = null;

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════
function go(screenId){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0,0);
}

function dashSection(sec){
  ['home','dispensers','qrs'].forEach(function(s){
    document.getElementById('sec-'+s).style.display = s===sec?'flex':'none';
    document.getElementById('sec-'+s).style.flexDirection = 'column';
  });
  document.querySelectorAll('.sidebar-item').forEach(function(el,i){
    el.classList.toggle('active', ['home','dispensers','qrs'][i]===sec);
  });
  if(sec==='home'||sec==='dispensers') renderDispensers();
}

// ══════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════
function selectPlan(el, plan){
  document.querySelectorAll('.plan-opt').forEach(function(o){o.classList.remove('selected');});
  el.classList.add('selected');
  selectedPlan = plan;
}

function showErr(id, msg){
  var el=document.getElementById(id);
  el.textContent=msg; el.style.display='block';
}
function hideErr(id){ document.getElementById(id).style.display='none'; }

function register(){
  hideErr('reg-err');
  var biz   = document.getElementById('reg-biz').value.trim();
  var name  = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim().toLowerCase();
  var phone = document.getElementById('reg-phone').value.replace(/\D/g,'');
  var pass  = document.getElementById('reg-pass').value;

  if(!biz||!name||!email||!phone||!pass) return showErr('reg-err','Completá todos los campos.');
  if(pass.length<6) return showErr('reg-err','La contraseña debe tener al menos 6 caracteres.');
  if(!phone||phone.length<8) return showErr('reg-err','Ingresá un número de WhatsApp válido.');

  var db=getDB();
  if(db.users.find(function(u){return u.email===email;})) return showErr('reg-err','Ya existe una cuenta con ese email.');

  var user={
    id: 'u'+Date.now(),
    biz, name, email, phone, pass,
    plan: selectedPlan,
    dispensers: [],
    createdAt: new Date().toISOString()
  };
  db.users.push(user);
  saveDB(db);
  saveSession({userId:user.id});
  loadDashboard();
  go('s-dashboard');
}

function login(){
  hideErr('login-err');
  var email = document.getElementById('login-email').value.trim().toLowerCase();
  var pass  = document.getElementById('login-pass').value;
  if(!email||!pass) return showErr('login-err','Completá email y contraseña.');
  var db=getDB();
  var user=db.users.find(function(u){return u.email===email&&u.pass===pass;});
  if(!user) return showErr('login-err','Email o contraseña incorrectos.');
  saveSession({userId:user.id});
  loadDashboard();
  go('s-dashboard');
}

function logout(){
  clearSession(); go('s-landing');
}

// ══════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════
function loadDashboard(){
  var u=getUser(); if(!u) return;
  var h=new Date().getHours();
  var g= h<12?'Buenos días':'¡Bienvenido de vuelta';
  document.getElementById('dash-greeting').textContent = g+', '+u.name.split(' ')[0]+' 👋';
  document.getElementById('dash-uname').textContent   = u.name;
  document.getElementById('dash-uemail').textContent  = u.email;
  document.getElementById('dash-avatar').textContent  = u.name.charAt(0).toUpperCase();
  document.getElementById('stat-disps').textContent   = u.dispensers.length;
  document.getElementById('stat-plan').textContent    = u.plan.charAt(0).toUpperCase()+u.plan.slice(1);
  document.getElementById('stat-phone').textContent   = '+'+u.phone.slice(0,4)+'...';
  dashSection('home');
  renderDispensers();
}

function renderDispensers(){
  var u=getUser(); if(!u) return;
  var disps=u.dispensers;
  var noEl=document.getElementById('no-disps');

  ['disp-grid-home','disp-grid-all'].forEach(function(gid){
    var grid=document.getElementById(gid);
    if(!grid) return;
    grid.innerHTML='';
    if(!disps.length){
      if(gid==='disp-grid-home') noEl.style.display='block';
      return;
    }
    if(gid==='disp-grid-home') noEl.style.display='none';
    disps.forEach(function(d){
      var card=document.createElement('div');
      card.className='disp-card';
      card.innerHTML=
        '<div class="disp-header">'+
          '<div class="disp-icon">💧</div>'+
          '<div class="disp-status">Activo</div>'+
        '</div>'+
        '<div class="disp-name">'+d.name+'</div>'+
        '<div class="disp-loc">📍 '+d.loc+'</div>'+
        '<div class="disp-actions">'+
          '<button class="btn btn-primary" onclick="showQR(\''+d.id+'\')">Ver QR</button>'+
          '<button class="btn btn-danger" onclick="deleteDisp(\''+d.id+'\')">🗑</button>'+
        '</div>';
      grid.appendChild(card);
    });
  });
}

function openModal(){ document.getElementById('modal-add').classList.add('open'); }
function closeModal(){
  document.getElementById('modal-add').classList.remove('open');
  document.getElementById('m-name').value='';
  document.getElementById('m-loc').value='';
}

function addDispenser(){
  var name=document.getElementById('m-name').value.trim();
  var loc =document.getElementById('m-loc').value.trim();
  if(!name||!loc){alert('Completá nombre y dirección.');return;}
  var db=getDB(); var u=db.users.find(function(u){return u.id===getSession().userId;});
  var d={id:'d'+Date.now(), name, loc, createdAt:new Date().toISOString()};
  u.dispensers.push(d);
  saveDB(db);
  closeModal();
  document.getElementById('stat-disps').textContent=u.dispensers.length;
  renderDispensers();
  showQR(d.id);
}

function deleteDisp(id){
  if(!confirm('¿Eliminar este dispensador?')) return;
  var db=getDB(); var u=db.users.find(function(u){return u.id===getSession().userId;});
  u.dispensers=u.dispensers.filter(function(d){return d.id!==id;});
  saveDB(db);
  document.getElementById('stat-disps').textContent=u.dispensers.length;
  renderDispensers();
}

// ══════════════════════════════════════════════
//  QR GENERATION
// ══════════════════════════════════════════════
function showQR(dispId){
  currentDispId=dispId;
  var u=getUser(); if(!u) return;
  var d=u.dispensers.find(function(x){return x.id===dispId;}); if(!d) return;

  // URL de la pantalla del cliente (esta misma página con params)
  var base=location.href.split('?')[0];
  var clientUrl=base+'?c=1&tel='+u.phone+'&loc='+encodeURIComponent(d.name+' - '+d.loc)+'&biz='+encodeURIComponent(u.biz);

  document.getElementById('qr-title').textContent='QR: '+d.name;
  document.getElementById('qr-disp-name').textContent=d.name;
  document.getElementById('qr-disp-loc').textContent='📍 '+d.loc;

  dashSection('qrs');
  setTimeout(function(){ drawQR('qr-canvas-dash', clientUrl, 260); }, 50);
}

function downloadQR(){
  var c=document.getElementById('qr-canvas-dash');
  var link=document.createElement('a');

// FIXED DRAW FUNCTION
function drawQR(canvasId, text, size){
  var c = document.getElementById(canvasId);
  if(!c){
    console.error("Canvas no encontrado");
    return;
  }

  size = size || 240;

  var qr = new qrcode(0, 'L');
  qr.addData(text);
  qr.make();

  var cnt = qr.getModuleCount();
  var cel = Math.floor(size/cnt);

  c.width = c.height = cel*cnt;

  var ctx = c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle='#000000';
  for(var r=0;r<cnt;r++){
    for(var cc=0;cc<cnt;cc++){
      if(qr.isDark(r,cc)){
        ctx.fillRect(cc*cel,r*cel,cel,cel);
      }
    }
  }
}

// DEMO
function generate(){
  drawQR('qr-canvas', 'https://example.com', 250);
